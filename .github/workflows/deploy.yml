name: Deploy to Production

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Executing remote SSH commands
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  port: ${{ secrets.VPS_PORT }}
                  timeout: 60s
                  command_timeout: 15m
                  script: |
                      set -e
                      # Charger l'environnement de root (indispensable pour pnpm et pm2)
                      export PATH=$PATH:/root/.local/share/pnpm:/usr/local/bin:/usr/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin

                      cd /var/www/salondanse

                      # Récupérer le dernier code sur main
                      git reset --hard
                      git pull origin main

                      # Dépendances & migration BDD
                      pnpm install --frozen-lockfile
                      pnpm exec prisma db push

                      # Build Nuxt
                      pnpm build

                      # Redémarrage PM2
                      pm2 restart ecosystem.config.cjs --update-env
                      pm2 save
